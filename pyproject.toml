[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "singlayer"
version = "0.2.0"
description = "Connect browser music to an existing Linux karaoke overlay"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiohttp>=3.12,<4", "dbus-fast>=2.44,<5", "qasync>=0.28,<1"]

[project.optional-dependencies]
engines = ["yt-dlp[default]==2026.8.19", "syncedlyrics==1.0.1", "shazamio==0.8.1", "numpy>=2,<3", "espeakng-loader==0.2.4", "langid==1.1.6", "pykakasi==2.3.0", "audioop-lts==0.2.2; python_version >= '3.13'"]

[project.scripts]
singlayer = "singlayer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"singlayer.pronunciation" = ["SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# dbus-fast uses D-Bus signatures, not Python names, in these annotations.
"src/singlayer/mpris.py" = ["F722", "F821"]
